function isPaid(v,m=month){const key=v.id+':'+m;if(Object.hasOwn(state.payments,key))return state.payments[key].paid===true;if(m==='2026-09')return v.id!==24&&v.index%13!==0;if(m==='2026-08')return v.index%8!==0;return v.index%5<3&&v.id!==24;}

function report(v,m=month){
 const factor=m==='2026-08'?.8:m==='2026-10'?.6:1,base=v.id===23?300:300+(v.index%7)*20,localBase=v.id===23?50:50+(v.index%5)*5;
 let total=Math.round(base*factor),local=Math.round(localBase*factor),seconds=local*240;
 const by=AUTHORS.map(a=>({id:a.id,seconds:seconds*a.weight,count:Math.round(local*a.weight)}));by[3].count=local-by.slice(0,3).reduce((s,a)=>s+a.count,0);
 for(const l of state.logs.filter(l=>l.venueId===v.id&&l.month===m))for(const t of l.tracks){total++;if(t.author&&authorById(t.author)){local++;const a=by.find(a=>a.id===t.author);const sec=Number(t.seconds)||240;a.seconds+=sec;a.count++;seconds+=sec;}}
 return {total,local,foreign:total-local,seconds,by};
}
function aggregate(vs=filteredVenues()){
 const by=AUTHORS.map(a=>({...a,seconds:0,count:0}));let total=0,local=0,seconds=0,collected=0,paid=0,onlineCount=0;
 for(const v of vs){if(isPaid(v)){collected+=v.fee;paid++;}if(online(v))onlineCount++;const r=report(v);total+=r.total;local+=r.local;seconds+=r.seconds;for(const a of r.by){const b=by.find(b=>b.id===a.id);b.seconds+=a.seconds;b.count+=a.count;}}
 const tax=Math.round(collected*state.settings.tax/100),agency=Math.round(collected*state.settings.agency/100),fund=collected-tax-agency;
 const ordered=by.map(a=>({...a,share:seconds?a.seconds/seconds:0,cents:Math.floor((seconds?a.seconds/seconds:0)*fund*100)}));let remainder=fund*100-ordered.reduce((s,a)=>s+a.cents,0);for(let i=0;i<remainder;i++)ordered[i%ordered.length].cents++;
 return {venues:vs.length,paid,online:onlineCount,collected,tax,agency,fund,total,local,seconds,authors:ordered.sort((a,b)=>b.seconds-a.seconds)};
}

 }

function collectionChart(){
 const buckets=Array.from({length:12},()=>({cash:0,minutes:0}));const days=month==='2026-09'?30:31;
 for(const v of filteredVenues()){
  const receipt=state.payments[v.id+':'+month];let day=1+(v.index*7)%days;
  if(receipt?.date){const d=new Date(receipt.date);if(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')===month)day=d.getDate();}
  const b=Math.min(11,Math.floor((day-1)*12/days));if(isPaid(v))buckets[b].cash+=v.fee;
  buckets[(v.index*5+Number(month.slice(-2)))%12].minutes+=report(v).seconds/60;
 }
 const maxCash=Math.max(1,...buckets.map(b=>b.cash)),maxMinutes=Math.max(1,...buckets.map(b=>b.minutes));let bars='';
 buckets.forEach((b,i)=>{const x=42+i*37,h=b.cash/maxCash*150,hm=b.minutes/maxMinutes*150,label=String(1+Math.floor(i*days/12)).padStart(2,'0');bars+=`<rect x="${x}" y="${185-h}" width="13" height="${h}" rx="4" fill="${i===5?'#7856ea':'#b9a5ee'}"><title>Период с ${label} числа: ${money(b.cash)}</title></rect><rect x="${x+15}" y="${185-hm}" width="9" height="${hm}" rx="3" fill="#d0eb84"><title>${num(b.minutes)} местных минут</title></rect><text x="${x+12}" y="211" fill="#a7afa4" text-anchor="middle" font-size="10">${label}</text>`;});
 return `<svg class="chart-svg" viewBox="0 0 510 230" role="img" aria-label="Поступления и звучание по дням выбранного месяца"><path d="M30 35h458M30 85h458M30 135h458M30 185h458" stroke="#edf0e9" stroke-dasharray="3 5"/>${bars}</svg><div class="chart-legend"><span><i></i>Лицензионные сборы</span><span><i class="lime"></i>Местные минуты</span><span style="margin-left:auto">Раздельные шкалы · демо</span></div>`;
}

function restaurants(){const vs=restaurantRows(),pages=Math.max(1,Math.ceil(vs.length/10));tablePage=Math.min(tablePage,pages);const slice=vs.slice((tablePage-1)*10,tablePage*10);return shell(head('Подключённые заведения','Договоры, подписки и цифровой след работы программы')+`<div class="card"><div class="table-filters"><div class="search">${icon('search')}<input class="input" id="restaurant-search" placeholder="Название или номер договора" value="${esc(restaurantSearch)}" aria-label="Поиск заведения"></div><select class="select" id="payment-filter" aria-label="Статус оплаты"><option value="all">Все статусы</option><option value="paid" ${paymentFilter==='paid'?'selected':''}>Оплачено</option><option value="unpaid" ${paymentFilter==='unpaid'?'selected':''}>Ожидает оплаты</option></select><select class="select" id="venue-sort" aria-label="Сортировка заведений"><option value="name">По названию</option><option value="id" ${venueSort==='id'?'selected':''}>По номеру</option><option value="volume" ${venueSort==='volume'?'selected':''}>По объёму музыки ↓</option></select><span class="table-count">Найдено ${num(vs.length)}</span></div><div class="table-wrap"><table><thead><tr><th>Заведение / договор</th><th>Регион</th><th>Подписка</th><th>Работа программы</th><th>Исполнений</th><th></th></tr></thead><tbody>${slice.length?slice.map(v=>`<tr class="clickable" data-venue="${v.id}" tabindex="0" role="button" aria-label="Открыть ${esc(v.name)}"><td><div class="flex"><span class="avatar">${icon('building')}</span><div class="venue-name"><strong>${esc(v.name)}</strong><small>№${v.id} · ${v.contract}</small></div></div></td><td class="muted">${regionById(v.region).name}</td><td>${badge(isPaid(v))}<div class="tiny muted" style="margin-top:5px">${money(v.fee)} / мес</div></td><td><span class="pill ${online(v)?'green':'red'}"><span class="dot"></span>${online(v)?'Онлайн':'Нет сигнала'}</span></td><td>${num(report(v).total)}<div class="tiny muted">${report(v).local} местных</div></td><td>${icon('arrow')}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">По этим фильтрам заведений нет.</td></tr>'}</tbody></table></div><div class="pagination"><span>Страница ${tablePage} из ${pages}</span><div class="flex gap6"><button class="btn small" id="table-prev" ${tablePage===1?'disabled':''}>← Назад</button><button class="btn small" id="table-next" ${tablePage===pages?'disabled':''}>Далее →</button></div></div></div><div class="note" style="margin-top:18px">${icon('pulse')} Долгие пропуски в дни мероприятий — повод связаться с заведением. День без мероприятия показывается отдельно и не считается нарушением.</div>`, 'restaurants');}
function payouts(){const a=aggregate(),global=aggregate(VENUES),scope=region==='all';return shell(head('Вознаграждения авторам','Распределение общего банка подписок по минутам местного звучания')+`<div class="grid-equal"><article class="card pad"><div class="card-title"><div><h3>Общий банк подписок</h3><p>${monthLabel()} · ${scope?'Кыргызстан':'выбранный регион — аналитический срез'}</p></div><span class="pill purple">${a.paid} подписок</span></div><div class="metric-value" style="font-size:38px">${money(a.collected)}</div><div class="split-fund"><div style="width:${state.settings.tax}%"></div><div style="width:${state.settings.agency}%"></div><div style="width:${100-state.settings.tax-state.settings.agency}%"></div></div><div class="fund-items"><div class="fund-item"><small>Налоги · ${state.settings.tax}%</small><strong>${money(a.tax)}</strong></div><div class="fund-item"><small>Кыргызпатент · ${state.settings.agency}%</small><strong>${money(a.agency)}</strong></div><div class="fund-item"><small>Авторам · ${100-state.settings.tax-state.settings.agency}%</small><strong style="color:var(--purple)">${money(a.fund)}</strong></div></div></article><article class="card pad"><div class="card-title"><div><h3>Как считается доля</h3><p>Один принцип для каждого правообладателя</p></div>${icon('music')}</div><div class="formula">Доля автора =<br><strong>его минуты ÷ все местные минуты</strong><br>Выплата = доля × фонд для авторов</div><p class="tiny muted" style="margin-top:16px">${num(a.seconds/60)} минут звучания учтено в этом срезе. Выплаты формируются из общенационального фонда, а не отдельно по каждому ресторану.</p></article></div><div class="card" style="margin-top:21px"><div class="card-title" style="padding:23px 23px 0"><div><h3>Ведомость за ${monthLabel().toLowerCase()}</h3><p>${scope?'Расчёт для всего Кыргызстана':'Региональная аналитика: выплаты доступны в общенациональном срезе'}</p></div><button class="btn soft small" id="export-payouts">${icon('download')} Скачать CSV</button></div><div class="table-wrap"><table><thead><tr><th>Правообладатель</th><th>Исполнений</th><th>Минут</th><th>Доля</th><th>К выплате</th><th>Статус</th><th></th></tr></thead><tbody>${a.authors.map(x=>{const done=state.payouts[month+':'+x.id]?.paid;return `<tr><td><div class="flex">${avatar(x)}<strong>${x.name}</strong></div></td><td>${num(x.count)}</td><td>${num(x.seconds/60)}</td><td>${(x.share*100).toFixed(1)}%</td><td><strong>${money(x.cents/100)}</strong></td><td><span class="pill ${done?'green':'purple'}">${done?'Выплачено · демо':'К выплате'}</span></td><td><button class="btn small" data-payout="${x.id}" ${done||!scope?'disabled':''}>${done?icon('check')+' Готово':'Провести выплату'}</button></td></tr>`;}).join('')}</tbody></table></div></div><p class="note notice" style="margin-top:18px">4% и 15% рассчитаны от валового сбора. Это параметры концепции, требующие утверждения. Проведение выплаты в прототипе меняет только демонстрационный статус.</p>`, 'payouts');}
function settings(){return shell(head('Настройки системы','Параметры концепции и модель регионального доступа',false)+`<form id="settings-form"><div class="settings-grid"><article class="card pad"><div class="card-title"><div><h3>Распределение фонда</h3><p>Проценты от общего банка подписок</p></div>${icon('wallet')}</div><div class="percent-inputs"><div class="field"><label for="tax-percent">Налоги, %</label><input class="input" type="number" min="0" max="99" step="1" id="tax-percent" value="${state.settings.tax}" required></div><div class="field"><label for="agency-percent">Кыргызпатент, %</label><input class="input" type="number" min="0" max="99" step="1" id="agency-percent" value="${state.settings.agency}" required></div></div><div class="settings-inline">Доля авторов: <strong id="author-percent">${100-state.settings.tax-state.settings.agency}%</strong>. Сумма всех долей должна составлять 100%.</div><p class="settings-help" style="margin-top:18px">Изменения сразу отражаются в расчёте выплат. В рабочей системе проценты утверждаются регламентом.</p><p class="settings-error" id="settings-error" hidden></p></article><article class="card pad"><div class="card-title"><div><h3>Региональные кабинеты</h3><p>Модель отдельных логинов для каждого региона</p></div>${icon('shield')}</div><div class="field"><label for="regional-access">Режим просмотра отчётов</label><select class="select" id="regional-access" style="width:100%"><option value="all">Центральный кабинет — все регионы</option>${REGIONS.map(r=>`<option value="${r.id}" ${state.settings.regionLogin===r.id?'selected':''}>Кабинет: ${r.name}</option>`).join('')}</select></div><p class="settings-help" style="margin-top:17px">Выбор включает соответствующий фильтр. Разграничение доступа по паролю реализуется на сервере в рабочей версии.</p><div class="setting-check"><span>Показывать Heartbeat в карточке</span><input type="checkbox" class="switch" id="heartbeat-setting" ${state.settings.heartbeat?'checked':''} aria-label="Показывать Heartbeat"></div><div class="setting-check"><span>Отмечать пробелы в работе</span><input type="checkbox" class="switch" id="alerts-setting" ${state.settings.alerts?'checked':''} aria-label="Отмечать пробелы в работе"></div></article></div><button class="btn primary" style="margin-top:20px" type="submit">${icon('check')} Сохранить настройки</button></form>`, 'settings');}
function calendar(v){const days=month==='2026-09'?30:31;const [year,mon]=month.split('-').map(Number),offset=(new Date(year,mon-1,1).getDay()+6)%7;return `<div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<span class="head">${d}</span>`).join('')}${'<span class="head"></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{const d=i+1;const off=d%7===2,gap=!off&&(d+v.index)%11===0;return `<span class="${off?'off':gap?(state.settings.alerts?'gap':'off'):''}" title="${d}: ${off?'Нет мероприятия':gap?'Нет сигнала':'Программа работала'}">${d}</span>`;}).join('')}</div><div class="chart-legend" style="margin-top:14px;gap:12px"><span><i class="lime"></i>Работала</span><span><i style="background:#ffc4c0"></i>Нет сигнала</span><span><i style="background:#e3e7e1"></i>Нет мероприятия</span></div>`;}
function studio(){const v=venueById(selectedVenue),active=session.active&&session.venueId===v.id;return `<article class="card studio ${active?'is-active':''}" id="studio"><div class="card-title"><div><h3>Клиент диджея</h3><p>Музыкальный поток → каталог прав → отчёт</p></div>${icon('headphones')}</div><span class="status-round ${active?'active':''}" id="session-status"><span class="dot"></span>${active?'Смена активна':'Готов к работе'}</span><div class="session-time" id="session-timer">00:00:00</div><div class="tiny" style="color:#91aa9a">Продолжительность мероприятия</div><div class="source-switch" role="group" aria-label="Источник данных">${[['computer','monitor','Выход компьютера'],['player','headphones','Подключение к плееру'],['playlist','music','Плейлист DJ']].map(([id,ic,title])=>`<button class="${source===id?'active':''}" data-source="${id}" aria-pressed="${source===id}">${icon(ic)}${title}</button>`).join('')}</div><div class="studio-wave" aria-hidden="true">${Array.from({length:40},(_,i)=>`<i style="height:${12+(i*17)%58}px;animation-delay:${(i%7)*.1}s"></i>`).join('')}</div><div class="tiny" style="color:#94ad9c;text-align:center">${source==='playlist'?'Загрузка TXT / M3U ниже':source==='computer'?'Демонстрация обработки музыкального выхода':'Демонстрация передачи данных от плеера'}</div><button class="btn lime" id="session-toggle">${icon(active?'stop':'play')}${active?'Завершить мероприятие':'Начать мероприятие'}</button><div class="heartbeat-footer" id="heartbeat-footer"><span>${state.settings.heartbeat?'Heartbeat · каждые 3 секунды':'Статус Heartbeat скрыт'}</span><span id="heartbeat-count">${active?session.count:0} сигналов</span></div><p class="tiny" style="color:#738d7b;margin-top:18px">Это макет клиента. Реальный звук компьютера не записывается; распознавание можно проверить на демо-сете или файле.</p></article>`;}
function playlistPreview(){if(!preview)return `<div class="empty">Загрузите файл или запустите демо-сет,<br>чтобы посмотреть результат распознавания.</div>`;const local=preview.tracks.filter(t=>t.author);return `<div class="flex between wrap" style="margin-top:21px"><strong class="tiny">${esc(preview.name)}</strong><span class="pill purple">${preview.sent?'Отправлен':'Распознан'}</span></div><div class="counts"><div class="count"><strong>${preview.tracks.length}</strong><small>Всего треков</small></div><div class="count local"><strong>${local.length}</strong><small>Местных совпадений</small></div><div class="count foreign"><strong>${preview.tracks.length-local.length}</strong><small>Других треков</small></div></div><div class="tracks-preview">${preview.tracks.slice(0,80).map(t=>`<div class="track-row"><span class="avatar" style="background:${t.author?'#ecf4da':'#f1edf9'};color:${t.author?'#91a46b':'#a596bc'}">${icon('music')}</span><div style="min-width:0"><strong>${esc(t.title)}</strong><small>${t.author?authorById(t.author).name:'Вне местного каталога'} · ${Math.floor(t.seconds/60)}:${String(t.seconds%60).padStart(2,'0')}</small></div><span class="pill ${t.author?'green':'gray'}">${t.author?'Учтён':'Общая статистика'}</span></div>`).join('')}</div><button class="btn primary" id="send-playlist" style="width:100%" ${preview.sent?'disabled':''}>${icon(preview.sent?'check':'upload')}${preview.sent?'Отчёт принят Кыргызпатентом':'Отправить отчёт в Кыргызпатент'}</button><p class="footnote">Названия сверяются с демонстрационным каталогом. Нет совпадения — это не доказательство отсутствия авторских прав. Длительность без тега: оценка 4 минуты.</p>`;}
function venueView(){const v=venueById(selectedVenue),r=report(v);return `<section class="venue-app view">${head('Приложение заведения','Версия, которая устанавливается на компьютер DJ',false)}<div class="filters" style="margin:-5px 0 23px"><select class="select" id="venue-select" aria-label="Заведение" ${session.active?'disabled':''}>${VENUES.slice(0,24).map(x=>`<option value="${x.id}" ${x.id===selectedVenue?'selected':''}>${esc(x.name)} · ${regionById(x.region).short}</option>`).join('')}</select><select class="select" id="month-filter" aria-label="Месяц подписки">${optionsMonths()}</select><span class="pill purple">Договор ${v.contract}</span><span class="tiny muted">${v.area} м² · категория Б</span></div><div class="venue-main"><div class="stack">${studio()}<article class="card license"><div class="flex between"><div><div class="eyebrow muted">Ежемесячная подписка</div><div class="license-amount">${money(v.fee)}</div></div>${badge(isPaid(v))}</div><p class="tiny muted" style="margin:10px 0 20px">${monthLabel()} · тариф по договору</p><button class="btn ${isPaid(v)?'soft':'primary'}" id="venue-pay" style="width:100%" ${isPaid(v)?'disabled':''}>${icon(isPaid(v)?'check':'wallet')}${isPaid(v)?'Подписка оплачена':'Оплатить через MBANK / Элсом'}</button><button class="btn small" data-venue="${v.id}" style="width:100%;margin-top:9px">История оплаты и отчётов ${icon('arrow')}</button></article></div><div class="stack"><article class="card pad"><div class="card-title"><div><h3>Репертуар мероприятия</h3><p>TXT / M3U из DJ-софта или демонстрация потока</p></div><span class="pill purple">Каталог прав</span></div><div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Загрузить плейлист">${icon('upload')}<strong>Перетащите плейлист сюда</strong><p>Rekordbox · Serato · Traktor · TXT / M3U до 2 МБ</p><button class="btn small" id="choose-file">Выбрать файл</button><input type="file" id="playlist-file" accept=".txt,.m3u,.m3u8" hidden></div><div class="flex wrap" style="margin-top:13px"><button class="btn soft small" id="demo-set">${icon('play')} Демо-сет: 30 треков</button><button class="btn small" id="live-sound">${icon('live')} Живой звук</button></div><div id="playlist-preview">${playlistPreview()}</div></article><article class="card pad"><div class="card-title"><div><h3>Что отправляется в Кыргызпатент</h3><p>Музыка, авторы, минуты и цифровой след</p></div>${icon('shield')}</div><div class="explain-row"><span class="avatar">${icon('music')}</span><div><strong>Местные совпадения входят в расчёт</strong><p>Пример: 30 треков → 5 совпадений с каталогом → 25 в общей статистике.</p></div></div><div class="explain-row"><span class="avatar">${icon('pulse')}</span><div><strong>Heartbeat подтверждает работу программы</strong><p>Отправляется раз в 3 секунды, пока смена активна. Это демонстрация связи.</p></div></div><div class="explain-row"><span class="avatar">${icon('wallet')}</span><div><strong>Подписка пополняет общий музыкальный фонд</strong><p>Доля автора определяется его звучанием во всех подключённых заведениях.</p></div></div></article></div></div><p class="footnote">Демо: данные хранятся в этом браузере. Реальные платежи, захват звука и серверная отправка в макете не выполняются.</p></section>`;}
function publicHeader(section){return `${head('Музыка объединяет.','Ответственный бизнес поддерживает культуру Кыргызстана',false)}<nav class="public-tabs" aria-label="Публичные разделы"><a href="#public/map" class="${section==='map'?'active':''}">${icon('map')} Карта заведений</a><a href="#public/music" class="${section==='music'?'active':''}">${icon('music')} Авторские песни</a></nav>`;}
function socialScore(v){return Math.min(100,Math.max(0,Math.round(v.score-(isPaid(v)?0:25)-(online(v)?0:8))));}
function publicVenues(){let vs=filteredVenues().filter(v=>!publicSearch||v.name.toLowerCase().includes(publicSearch.toLowerCase()));vs.sort(publicSort==='score'?(a,b)=>socialScore(b)-socialScore(a):publicSort==='paid'?(a,b)=>Number(isPaid(b))-Number(isPaid(a)):(a,b)=>a.name.localeCompare(b.name,'ru'));return vs;}
function publicList(){const vs=publicVenues();return vs.length?vs.slice(0,40).map((v,i)=>`<article class="public-venue" data-venue="${v.id}" tabindex="0" role="button" aria-label="Открыть публичную карточку ${esc(v.name)}"><span class="rank">${i+1}</span><span class="avatar" style="background:${isPaid(v)?'#eff6dd':'#fff0e7'};color:${isPaid(v)?'#7d9865':'#c69368'}">${icon('building')}</span><div class="venue-name"><strong>${esc(v.name)}</strong><small>${regionById(v.region).name}</small><div style="margin-top:7px">${badge(isPaid(v))}</div></div><div class="rating">${socialScore(v)}<small>из 100</small></div></article>`).join(''):'<div class="empty">Заведения не найдены.</div>';}
function publicMap(){const a=aggregate();return `<section class="public view">${publicHeader('map')}<div class="filters" style="margin-bottom:23px">${filters().replace('<div class="filters">','').replace(/<\/div>$/,'')}<span class="pill purple">Рейтинг социальной ответственности</span></div><div class="public-map-layout"><article class="card public-map-card map-card"><div class="card-title"><div><h3>Здесь поддерживают авторов</h3><p>Нажмите точку или выберите заведение из списка</p></div><button class="btn small" data-reset-region>Сбросить</button></div><div id="public-map-svg">${countryMap('public')}</div><div class="map-bottom"><span><span class="dot" style="display:inline-block;color:var(--purple)"></span> Подписка оплачена</span><span><span class="dot" style="display:inline-block;color:#ff9c79"></span> Ожидает оплаты</span></div><div class="public-stat-row"><div><strong id="public-count">${num(a.venues)}</strong><small>Подключено</small></div><div><strong>${num(a.paid)}</strong><small>Поддержали авторов</small></div><div><strong>${num(a.collected/1000)} тыс.</strong><small>Сом собрано</small></div></div><p class="map-source" style="margin-top:17px">Контуры: geoBoundaries / gbOpen. Адреса и точки — демонстрационные.</p></article><article class="card"><div class="card-title" style="padding:23px 22px 0"><div><h3>Рейтинг заведений</h3><p>Оплата + регулярность отчётности</p></div>${icon('star')}</div><div class="table-filters" style="padding-top:0"><div class="search">${icon('search')}<input class="input" id="public-search" placeholder="Найти заведение" aria-label="Поиск на карте" value="${esc(publicSearch)}"></div><select class="select" id="public-sort" aria-label="Сортировка публичного списка"><option value="score">По рейтингу ↓</option><option value="paid" ${publicSort==='paid'?'selected':''}>Сначала оплаченные</option><option value="name" ${publicSort==='name'?'selected':''}>По названию</option></select></div><div class="venue-list" id="public-venue-list">${publicList()}</div><div class="pagination"><span id="public-result-count">${publicVenues().length} заведений · показано до 40</span><span>Демо-рейтинг</span></div></article></div><div class="trust-band"><div><div class="eyebrow">Социально ответственный бизнес</div><h3>Подписка, которой можно гордиться.</h3><p>Гость видит, что заведение поддерживает национальную культуру. QR со знака качества ведёт на эту карточку. Формула демо-рейтинга учитывает оплату и регулярность отчётов.</p></div><button class="btn lime" id="open-ala">Карточка «Ала-Тоо» ${icon('arrow')}</button></div><p class="footnote">Сумма поддержки — лицензия за текущий выбранный месяц. Публичные карточки не показывают контакты, номер договора и внутренние отчёты.</p></section>`;}
function songCards(){const ss=SONGS.filter(s=>(catalogAuthor==='all'||s.author===catalogAuthor)&&(!catalogSearch||(s.title+' '+authorById(s.author).name).toLowerCase().includes(catalogSearch.toLowerCase())));return ss.length?ss.map(s=>{const a=authorById(s.author);return `<article class="card song-card"><div class="song-cover" style="background:${s.color};color:${a.ink}"><strong>${a.initials}</strong><button class="play-song" data-play-song="${s.id}" aria-label="Прослушать демо-аудио: ${esc(s.title)}">${icon(playingSong===s.id?'stop':'play')}</button></div><h3>${s.title}</h3><p>${a.name}</p><div class="song-meta"><span>${s.id} · ${s.tag}</span><span>${Math.floor(s.seconds/60)}:${String(s.seconds%60).padStart(2,'0')}</span></div><div class="flex"><button class="btn soft small" data-download-song="${s.id}">${icon('download')} Демо WAV</button><button class="btn small" data-song-card="${s.id}">Карточка</button></div><div class="footnote" style="margin-top:12px">Демо каталога · аудио — синтезированный образец</div></article>`;}).join(''):'<div class="empty">Песни не найдены.</div>';}

function toggleSession(){if(session.active){session.active=false;session.paused=false;toast('Мероприятие завершено. Не забудьте отправить репертуар.');}else{session.active=true;session.venueId=selectedVenue;session.start=Date.now();session.lastHeartbeat=Date.now();session.count=1;session.paused=false;session.liveAdded=false;toast('Смена активна. Первый Heartbeat отправлен.');}render();}
function updateTimer(){if(!$('session-timer'))return;const sec=session.active?Math.floor((Date.now()-session.start)/1000):0;$('session-timer').textContent=[Math.floor(sec/3600),Math.floor(sec/60)%60,sec%60].map(n=>String(n).padStart(2,'0')).join(':');if($('heartbeat-count'))$('heartbeat-count').textContent=session.count+' сигналов';}
function demoTracks(){const locals=SONGS.slice(0,5).map(s=>({title:s.title,author:s.author,seconds:s.seconds}));const others=['Dua Lipa — Levitating','The Weeknd — Blinding Lights','Ed Sheeran — Shape of You','Daft Punk — Get Lucky','Calvin Harris — Summer','ABBA — Dancing Queen','Michael Jackson — Billie Jean','Adele — Rolling in the Deep','Bruno Mars — Uptown Funk','Sia — Chandelier','Avicii — Wake Me Up','Beyoncé — Halo','Coldplay — Viva La Vida','Imagine Dragons — Believer','Shakira — Waka Waka','David Guetta — Titanium','Maroon 5 — Sugar','Rihanna — Diamonds','Lady Gaga — Poker Face','OneRepublic — Counting Stars','Queen — Another One Bites the Dust','Justin Timberlake — Can’t Stop the Feeling','Clean Bandit — Rather Be','Katy Perry — Firework','Stromae — Alors on danse'];return [...locals,...others.map(title=>({title,author:null,seconds:240}))];}
function parseText(text){let seconds=null,title=null;const tracks=[];for(let line of text.replace(/^\uFEFF/,'').split(/\r?\n/)){line=line.trim();if(!line)continue;if(line.startsWith('#EXTINF:')){const m=line.match(/^#EXTINF:([\d.\-]+),(.*)$/);if(m){seconds=Number(m[1])>0?Math.min(7200,Math.round(Number(m[1]))):null;title=m[2].trim();}continue;}if(line.startsWith('#'))continue;let label=title||line;title=null;label=label.replace(/^.*[\\/]/,'').replace(/\.(mp3|wav|flac|aiff|aac|ogg)$/i,'');let sec=seconds||240;seconds=null;const duration=label.match(/\b(\d{1,2}):(\d{2})\s*$/);if(duration){sec=Math.min(7200,Number(duration[1])*60+Number(duration[2]));label=label.slice(0,duration.index).trim();}if(!label)continue;const norm=label.toLowerCase();let author=AUTHORS.find(a=>norm.includes(a.name.toLowerCase()))?.id||null;if(!author){const alt=[['mirbek',/mirbek|атабеков/],['bek',/borbiev|борбиев/],['gulnur',/gulnur|гульнур|сатылганова/],['omar',/\bomar\b|омар/]];author=alt.find(([,r])=>r.test(norm))?.[0]||null;}if(!author){const song=SONGS.find(s=>norm===s.title.toLowerCase());author=song?.author||null;}tracks.push({title:label,author,seconds:Math.max(1,sec)});if(tracks.length>2000)throw new Error('В одном демо-файле поддерживается до 2000 треков.');}if(!tracks.length)throw new Error('В файле нет названий треков.');return tracks;}
async function readPlaylist(file){const req=++lastFileRequest,venueId=selectedVenue;try{if(!/\.(txt|m3u|m3u8)$/i.test(file.name))throw new Error('Поддерживаются TXT, M3U и M3U8.');if(file.size>2*1024*1024)throw new Error('Максимальный размер — 2 МБ.');const text=await file.text();if(req!==lastFileRequest||venueId!==selectedVenue)return;const tracks=parseText(text);preview={name:file.name,venueId,tracks,sent:false};if($('playlist-preview')){$('playlist-preview').innerHTML=playlistPreview();bindSend();}toast(`Распознано ${tracks.length} треков, местных совпадений: ${tracks.filter(t=>t.author).length}.`);}catch(e){if(req===lastFileRequest)toast(e.message);}}
function sendPlaylist(){if(!preview||preview.sent)return;if(preview.venueId!==selectedVenue){toast('Плейлист относится к другому заведению.');return;}state.logs.push({id:Date.now(),venueId:preview.venueId,month,date:new Date().toISOString(),name:preview.name,tracks:preview.tracks.map(t=>({...t}))});preview.sent=true;save();$('playlist-preview').innerHTML=playlistPreview();bindSend();toast('Отчёт принят. Минуты авторов добавлены в выбранный месяц.');}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function downloadCSV(rows,name){const safe=x=>{let s=String(x);if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};download('\uFEFF'+rows.map(r=>r.map(safe).join(';')).join('\r\n'),name,'text/csv;charset=utf-8');toast('CSV готов к скачиванию.');}
function setModal(html,kind=''){modalReturnFocus=document.activeElement;$('modal-root').innerHTML=`<div class="modal" id="modal-backdrop"><section class="dialog ${kind}" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1">${html}</section></div>`;document.body.style.overflow='hidden';$('modal-root').querySelector('.close')?.focus();$('modal-backdrop').addEventListener('click',e=>{if(e.target.id==='modal-backdrop')closeModal();});}

function openVenue(id){const v=venueById(id);if(!v)return;modalVenue=v.id;const r=report(v),global=aggregate(VENUES),list=r.by.map(x=>({...authorById(x.id),...x,share:r.seconds?x.seconds/r.seconds:0,cents:0})).sort((a,b)=>b.seconds-a.seconds),isPublic=route.startsWith('public');
 if(isPublic){const total=MONTHS.reduce((s,m)=>s+(isPaid(v,m.id)?v.fee:0),0);setModal(modalHead(esc(v.name),regionById(v.region).name,'Публичная карточка / поддержка культуры')+`<div class="dialog-body"><div class="flex between wrap"><div><div class="eyebrow muted">Социальная ответственность</div><div class="metric-value" style="color:var(--purple)">${socialScore(v)} <small style="font-size:13px;color:#aaa">/ 100</small></div></div>${badge(isPaid(v))}</div><div class="license-strip"><div><small class="muted">Вклад за ${monthLabel().toLowerCase()}</small><div><strong>${money(isPaid(v)?v.fee:0)}</strong></div></div>${icon('shield')}</div><p class="tiny muted" style="line-height:1.85">${isPaid(v)?'Заведение поддерживает национальную культуру: подписка за выбранный месяц оплачена.':'За выбранный месяц оплата подписки ещё не зафиксирована.'} Общий вклад за три месяца демонстрации: <strong>${money(total)}</strong>.</p><div class="rule"></div><div class="eyebrow muted" style="margin-bottom:15px">История поддержки</div><div class="table-wrap">${paymentHistory(v)}</div><p class="footnote">Рейтинг — демонстрационная оценка: базовый балл отчётности минус 25 при неоплаченной подписке и минус 8 при отсутствии связи. Контакты и договор не публикуются.</p></div>`);return;}

iv>`);

function qr(){let squares='';for(let y=0;y<25;y++)for(let x=0;x<25;x++){const finder=[[1,1],[17,1],[1,17]].some(([a,b])=>x>=a&&x<a+7&&y>=b&&y<b+7&&(x===a||x===a+6||y===b||y===b+6||(x>=a+2&&x<=a+4&&y>=b+2&&y<=b+4)));if(finder||((x*19+y*13+x*y)%11<5&&!((x<9&&y<9)||(x>15&&y<9)||(x<9&&y>15))))squares+=`<rect x="${x*6}" y="${y*6}" width="6" height="6"/>`;}return `<div class="qr-placeholder"><svg viewBox="0 0 150 150" width="160" height="160" aria-label="Иллюстрация QR-кода"><rect width="150" height="150" fill="white"/><g fill="#244436">${squares}</g></svg><span class="qr-overlay">ДЕМО · НЕ ДЛЯ ОПЛАТЫ</span></div>`;}
function openPayment(id){const v=venueById(id);if(!v||isPaid(v))return;paymentVenue=v.id;paymentMonth=month;setModal(modalHead('Оплата подписки',`${v.name} · ${monthLabel()}`,'Демонстрация оплаты')+`<div class="dialog-body" style="text-align:center"><div class="metric-value">${money(v.fee)}</div><p class="tiny muted">Категория Б · договор ${v.contract}</p><div class="provider-row"><button class="provider active" data-provider="MBANK">MBANK</button><button class="provider" data-provider="Элсом">Элсом</button><button class="provider" data-provider="MegaPay">MegaPay</button></div>${qr()}<p class="tiny muted" style="margin:12px 0 21px">Демо QR не содержит платёжной ссылки.<br>Для проверки сценария нажмите кнопку ниже.</p><button class="btn primary" id="confirm-payment" style="width:100%">${icon('check')} Подтвердить демо-оплату</button></div>`,'payment');}
function confirmPayment(){if(!paymentVenue||!paymentMonth)return;const id=paymentVenue,m=paymentMonth;if(isPaid(venueById(id),m)){closeModal();return;}state.payments[id+':'+m]={paid:true,date:new Date().toISOString(),amount:venueById(id).fee};save();closeModal();render();toast('Подписка оплачена в демо. Баланс фонда и публичный статус обновлены.');}
function openLiveSound(){setModal(modalHead('Учёт живого выступления','Выберите артиста и длительность','Репертуар / живой звук')+`<form class="dialog-body" id="live-form"><div class="field"><label for="live-author">Артист</label><select class="select" id="live-author" style="width:100%">${AUTHORS.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div><div class="field" style="margin-top:18px"><label for="live-minutes">Продолжительность, минут</label><input class="input" type="number" id="live-minutes" value="20" min="1" max="240" required></div><p class="tiny muted" style="margin:18px 0">Выступление добавится к репертуару. Отправьте отчёт, чтобы минуты вошли в расчёт.</p><button class="btn primary" type="submit" style="width:100%">${icon('live')} Добавить выступление</button></form>`,'payment');$('live-form').onsubmit=e=>{e.preventDefault();const mins=Number($('live-minutes').value);if(!Number.isFinite(mins)||mins<1||mins>240)return;const a=$('live-author').value;if(!preview||preview.sent)preview={name:'Живое выступление',venueId:selectedVenue,tracks:[],sent:false};preview.tracks.push({title:'Живое выступление · '+authorById(a).name,author:a,seconds:Math.round(mins*60)});closeModal();render();toast('Живое выступление добавлено в репертуар.');};}
function openPayout(id){const a=aggregate(VENUES).authors.find(a=>a.id===id);if(!a||state.payouts[month+':'+id]?.paid||region!=='all')return;setModal(modalHead('Выплата автору',a.name,'Ведомость / '+monthLabel())+`<div class="dialog-body"><div class="metric-value" style="text-align:center">${money(a.cents/100)}</div><p class="tiny muted" style="margin:13px 0 20px;text-align:center">Доля звучания: ${(a.share*100).toFixed(1)}% · ${num(a.seconds/60)} минут</p><div class="note notice">Это демонстрация. Перевод денежных средств не выполняется.</div><button class="btn primary" data-confirm-payout="${id}" style="width:100%;margin-top:20px">${icon('check')} Подтвердить демо-выплату</button></div>`,'payment');}
function wav(id){const rate=22050,len=rate*7,buffer=new ArrayBuffer(44+len*2),d=new DataView(buffer);const str=(at,s)=>{for(let i=0;i<s.length;i++)d.setUint8(at+i,s.charCodeAt(i));};str(0,'RIFF');d.setUint32(4,36+len*2,true);str(8,'WAVE');str(12,'fmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,rate,true);d.setUint32(28,rate*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);str(36,'data');d.setUint32(40,len*2,true);const notes=[261.63,329.63,392,440,392,329.63,293.66,261.63],shift=SONGS.findIndex(s=>s.id===id)*2;for(let i=0;i<len;i++){const t=i/rate,pos=t%0.875,idx=Math.floor(t/.875)%8,f=notes[(idx+shift)%8],env=Math.min(1,pos/.03)*Math.max(0,1-pos/.875)*.18;d.setInt16(44+i*2,Math.sin(2*Math.PI*f*t)*env*32767,true);}return buffer;}
async function playSong(id){if(!SONGS.some(s=>s.id===id))return;if(playingSong){audioContext?.close();audioContext=null;const old=playingSong;playingSong=null;if(old===id){$('song-grid').innerHTML=songCards();return;}}const ctx=new (window.AudioContext||window.webkitAudioContext)();audioContext=ctx;try{const audio=await ctx.decodeAudioData(wav(id));if(audioContext!==ctx)return;const src=ctx.createBufferSource();src.buffer=audio;src.connect(ctx.destination);playingSong=id;$('song-grid').innerHTML=songCards();src.start();src.onended=()=>{if(audioContext===ctx){playingSong=null;ctx.close();audioContext=null;if($('song-grid'))$('song-grid').innerHTML=songCards();}};toast('Звучит синтезированный образец, не запись артиста.');}catch(_){toast('Прослушивание недоступно. Демо WAV можно скачать.');}}
document.addEventListener('click',e=>{
 const close=e.target.closest('[data-close-modal]');if(close){closeModal();return;}
 const venue=e.target.closest('[data-venue]');if(venue){openVenue(venue.dataset.venue);return;}
 const map=e.target.closest('[data-map-region]');if(map){region=map.dataset.mapRegion;tablePage=1;render();return;}
 const provider=e.target.closest('[data-provider]');if(provider){document.querySelectorAll('[data-provider]').forEach(b=>b.classList.toggle('active',b===provider));return;}
 if(e.target.closest('#confirm-payment')){confirmPayment();return;}
 const payout=e.target.closest('[data-payout]');if(payout){openPayout(payout.dataset.payout);return;}
 const confirm=e.target.closest('[data-confirm-payout]');if(confirm){const a=aggregate(VENUES).authors.find(a=>a.id===confirm.dataset.confirmPayout);if(!a||state.payouts[month+':'+a.id]?.paid)return;state.payouts[month+':'+a.id]={paid:true,amount:a.cents/100,date:new Date().toISOString()};save();closeModal();render();toast('Выплата отмечена как проведённая в демо.');return;}
 const song=e.target.closest('[data-download-song]');if(song){download(wav(song.dataset.downloadSong),song.dataset.downloadSong+'-demo-sample.wav','audio/wav');toast('Скачивается синтезированный WAV-образец, не запись артиста.');return;}
 const songCard=e.target.closest('[data-song-card]');if(songCard){const s=SONGS.find(s=>s.id===songCard.dataset.songCard);if(!s)return;setModal(modalHead(s.title,authorById(s.author).name,'Карточка произведения / демо')+`<div class="dialog-body"><div class="profile-details"><div><small>Код каталога</small>${s.id}</div><div><small>Длительность в макете</small>${s.seconds} секунд</div><div><small>Жанр</small>${s.tag}</div><div><small>Статус</small>Демонстрационная карточка</div></div><div class="note notice" style="margin-top:20px">Названия и связи с авторами приведены для интерфейса. Реестр прав и записи подтверждаются правообладателями при подключении системы.</div><button class="btn soft" data-download-card="${s.id}" style="margin-top:20px">${icon('download')} Скачать карточку JSON</button></div>`,'payment');return;}
 const card=e.target.closest('[data-download-card]');if(card){const s=SONGS.find(s=>s.id===card.dataset.downloadCard);download(JSON.stringify({...s,author:authorById(s.author).name,status:'demo',audio:'synthetic sample; not an artist recording'},null,2),s.id+'-demo.json','application/json');return;}
 const play=e.target.closest('[data-play-song]');if(play){playSong(play.dataset.playSong);return;}
 const rep=e.target.closest('[data-download-report]');if(rep){const v=venueById(rep.dataset.downloadReport),r=report(v);downloadCSV([['Заведение','Месяц','Автор','Исполнений','Минут'],...r.by.map(a=>[v.name,month,authorById(a.id).name,a.count,(a.seconds/60).toFixed(2)])],v.contract+'-'+month+'.csv');}
});
document.addEventListener('keydown',e=>{const target=e.target.closest('[data-venue],[data-map-region]');if((e.key==='Enter'||e.key===' ')&&target&&target.tagName!=='BUTTON'){e.preventDefault();target.click();}if(!$('modal-root').firstChild)return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const items=[...$('modal-root').querySelectorAll('button:not([disabled]),input,select,a[href]')].filter(x=>x.offsetParent!==null);const first=items[0],last=items.at(-1);if(!first)return;if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('hashchange',()=>{closeModal();render();window.scrollTo(0,0);});
setInterval(updateTimer,1000);
setInterval(()=>{if(session.active&&!session.paused){session.lastHeartbeat=Date.now();session.count++;updateTimer();}},3000);
window.addEventListener('pagehide',()=>{audioContext?.close();});
render();
if(document.modelContext?.registerTool){const lifecycle=new AbortController();try{Promise.resolve(document.modelContext.registerTool({name:'navigate_patent_check',title:'Открыть раздел Патент Чек',description:'Открывает главный экран, приложение заведения, кабинет Кыргызпатента или публичную карту. Платежи и отчёты не изменяются.',inputSchema:{type:'object',properties:{section:{type:'string',enum:['home','venue','admin/dashboard','admin/restaurants','admin/payouts','admin/settings','public/map','public/music']}},required:['section'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||typeof input!=='object'||Object.keys(input).some(k=>k!=='section')||!['home','venue','admin/dashboard','admin/restaurants','admin/payouts','admin/settings','public/map','public/music'].includes(input.section))throw new Error('Укажите допустимый раздел.');location.hash=input.section;render();return {section:route};}},{signal:lifecycle.signal})).catch(()=>{});window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});}catch(_){}}
</script>
</body>
